<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div id="calculator">
        <input type="text" id="display" readonly>
        <div id="keys">
            <button class="num" onclick="appendInput('7')">7</button>
            <button class="num" onclick="appendInput('8')">8</button>
            <button class="num" onclick="appendInput('9')">9</button>
            <button class="op" onclick="appendInput('+')">+</button>
            <button class="num" onclick="appendInput('4')">4</button>
            <button class="num" onclick="appendInput('5')">5</button>
            <button class="num" onclick="appendInput('6')">6</button>
            <button class="op" onclick="appendInput('-')">-</button>
            <button class="num" onclick="appendInput('1')">1</button>
            <button class="num" onclick="appendInput('2')">2</button> 
            <button class="num" onclick="appendInput('3')">3</button>
            <button class="op" onclick="appendInput('*')">x</button>
            <button class="num" onclick="appendInput('.')">.</button>
            <button class="num" onclick="appendInput('0')">0</button>
            <button class="op" onclick="calculate()">=</button>
            <button class="op" onclick="appendInput('/')">/</button>
            <button class="op" onclick="clearInput()">C</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
