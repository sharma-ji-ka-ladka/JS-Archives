<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
</head>
<body>
    <div id="container">
        <h1>Dice Roller</h1>
        <label for="dice#"># of Dice: </label>
        <input type="number" id="dice#" max="6" min="0">
        <button onclick="roll()">Roll Dice</button>
        <div id="result"></div>
        <div id="display"></div>
    </div>
</body>
</html>
